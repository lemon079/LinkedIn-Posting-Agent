[package]
name = "praxis"
version = "1.1.0"
description = "Praxis LinkedIn Agent"
authors = ["Praxis Team"]
edition = "2021"

[lib]
name = "praxis"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "1.0.138"
