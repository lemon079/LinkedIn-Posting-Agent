name: Build & Release Native Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build Windows Desktop App'
        required: true
        type: boolean
        default: true
      build_mobile:
        description: 'Build Android Mobile App'
        required: true
        type: boolean
        default: true

env:
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  NEXT_PUBLIC_SITE_URL: "https://linkedin-agent.vercel.app"

jobs:
  build-windows:
    name: Build Windows Desktop App
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_desktop }}
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm install

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://linkedin-agent.vercel.app"

      - name: Build Tauri Windows Installer
        run: npx tauri build

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praxis-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    name: Build Android Mobile App
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mobile }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust & Android Target Toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node Dependencies
        run: npm install

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://linkedin-agent.vercel.app"

      - name: Initialize & Build Tauri Android APK
        run: |
          npx tauri android init --force || true
          npx tauri android build --apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praxis-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  create-github-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Praxis-Windows-Setup
          path: release-artifacts/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Praxis-Android-APK
          path: release-artifacts/android

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/windows/*
            release-artifacts/android/*
          generate_release_notes: true
          draft: false
          prerelease: false
