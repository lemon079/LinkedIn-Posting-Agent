name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  NEXT_PUBLIC_SITE_URL: "https://linkedin-agent.vercel.app"

jobs:
  build-android:
    name: Build Android Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust & Android Target Toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node Dependencies
        run: npm install

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://linkedin-agent.vercel.app"

      - name: Initialize & Build Tauri Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --ci --target aarch64

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praxis-Android-APK
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/**/outputs/apk/**/*.apk

  create-github-release:
    name: Create GitHub Release
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Praxis-Android-APK
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.apk
            release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

